services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maritime_claims}
      POSTGRES_USER: ${POSTGRES_USER:-maritime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-local-env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maritime} -d ${POSTGRES_DB:-maritime_claims}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://maritime:change-me-in-local-env@db:5432/maritime_claims}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  preflight:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.core.preflight"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://maritime:change-me-in-local-env@db:5432/maritime_claims}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/documents}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALLOW_EXTERNAL_AI_RESTRICTED: ${ALLOW_EXTERNAL_AI_RESTRICTED:-false}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    volumes:
      - local_documents:/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Maritime Claims & Risk Intelligence Platform}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://maritime:change-me-in-local-env@db:5432/maritime_claims}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/documents}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_POLL_SECONDS: ${PROCESSING_POLL_SECONDS:-2}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-60000}
      ALLOW_EXTERNAL_AI_RESTRICTED: ${ALLOW_EXTERNAL_AI_RESTRICTED:-false}
    ports:
      - "8000:8000"
    volumes:
      - local_documents:/data/documents
    depends_on:
      preflight:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.workers.document_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://maritime:change-me-in-local-env@db:5432/maritime_claims}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/documents}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      PROCESSING_MAX_ATTEMPTS: ${PROCESSING_MAX_ATTEMPTS:-3}
      PROCESSING_POLL_SECONDS: ${PROCESSING_POLL_SECONDS:-2}
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-60000}
      ALLOW_EXTERNAL_AI_RESTRICTED: ${ALLOW_EXTERNAL_AI_RESTRICTED:-false}
    volumes:
      - local_documents:/data/documents
    depends_on:
      preflight:
        condition: service_completed_successfully

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  demo-seed:
    profiles: ["demo"]
    build:
      context: ./apps/api
    command: ["python", "-m", "app.demo.seed_mt_orion"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://maritime:change-me-in-local-env@db:5432/maritime_claims}
      SECRET_KEY: ${SECRET_KEY:-replace-with-a-long-random-secret}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: ${LOCAL_STORAGE_PATH:-/data/documents}
      AI_PROVIDER: disabled
      MCRI_DEMO_FIXTURE_DIR: /demo/mt-orion
      MCRI_DEMO_ORG_NAME: ${MCRI_DEMO_ORG_NAME:-Pilot Marine Insurer}
      MCRI_DEMO_ORG_SLUG: ${MCRI_DEMO_ORG_SLUG:-pilot}
      MCRI_DEMO_EMAIL: ${MCRI_DEMO_EMAIL:-manager@pilot.test}
      MCRI_DEMO_PASSWORD: ${MCRI_DEMO_PASSWORD:-}
    volumes:
      - local_documents:/data/documents
      - ./docs/pilot/mt-orion/documents:/demo/mt-orion:ro
    depends_on:
      preflight:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
  local_documents:
