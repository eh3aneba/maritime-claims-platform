name: Lock Regeneration Diagnostic

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lock-regeneration-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-locks:
    name: Regenerate dependency locks artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
            tests/browser/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate dependency locks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.6.1"
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements.lock apps/api/requirements.txt
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements-dev.lock --strip-extras apps/api/requirements-dev.in" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements-dev.lock apps/api/requirements-dev.in
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=tests/browser/requirements.lock --strip-extras tests/browser/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=tests/browser/requirements.lock tests/browser/requirements.txt
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --prefix apps/web

      - name: Capture generated lock diff
        run: |
          mkdir -p regenerated-locks/apps/api regenerated-locks/apps/web regenerated-locks/tests/browser
          cp apps/api/requirements.lock regenerated-locks/apps/api/requirements.lock
          cp apps/api/requirements-dev.lock regenerated-locks/apps/api/requirements-dev.lock
          cp apps/web/package-lock.json regenerated-locks/apps/web/package-lock.json
          cp tests/browser/requirements.lock regenerated-locks/tests/browser/requirements.lock
          git diff -- \
            apps/api/requirements.lock \
            apps/api/requirements-dev.lock \
            apps/web/package-lock.json \
            tests/browser/requirements.lock > regenerated-locks/lock-diff.patch || true

      - name: Upload regenerated dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-dependency-locks
          path: regenerated-locks/
          if-no-files-found: error
          retention-days: 1
