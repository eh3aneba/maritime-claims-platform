name: Temporary Regenerate API Locks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate-api-locks:
    name: Regenerate API lockfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Regenerate API dependency locks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.6.1"
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements.lock apps/api/requirements.txt
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements-dev.lock --strip-extras apps/api/requirements-dev.in" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements-dev.lock apps/api/requirements-dev.in

      - name: Upload regenerated API lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-api-locks
          path: |
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit regenerated locks and remove temporary workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-regenerate-api-locks.yml
          git add apps/api/requirements.lock apps/api/requirements-dev.lock
          git diff --cached --check
          git commit -m "chore: regenerate API dependency locks"
          git push origin HEAD:"$HEAD_REF"
