name: Temporary Dependency Lock Sync

on:
  push:
    branches:
      - feature/sftp-production-integration-closure

permissions:
  contents: write

concurrency:
  group: lock-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/sftp-production-integration-closure

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Regenerate dependency locks exactly as CI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.6.1"
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements.lock apps/api/requirements.txt
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements-dev.lock --strip-extras apps/api/requirements-dev.in" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements-dev.lock apps/api/requirements-dev.in
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=tests/browser/requirements.lock --strip-extras tests/browser/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=tests/browser/requirements.lock tests/browser/requirements.txt
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix apps/web

      - name: Commit canonical lock outputs
        shell: bash
        run: |
          set -euo pipefail
          git add \
            apps/api/requirements.lock \
            apps/api/requirements-dev.lock \
            apps/web/package-lock.json \
            tests/browser/requirements.lock
          if git diff --cached --quiet; then
            echo "Dependency locks already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync dependency locks"
          git push origin HEAD:feature/sftp-production-integration-closure
