name: Persian OCR Local Metrics

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/persian_ocr_local_validation_metrics.py
      - scripts/tests/test_persian_ocr_local_validation_metrics.py
      - scripts/persian_ocr_blind_cohort_preflight.py
      - scripts/tests/test_persian_ocr_blind_cohort_preflight.py
      - scripts/persian_ocr_local_source_integrity.py
      - scripts/tests/test_persian_ocr_local_source_integrity.py
      - scripts/persian_ocr_offline_study_run.py
      - scripts/tests/test_persian_ocr_offline_study_run.py
      - scripts/persian_ocr_review_disagreement_metrics.py
      - scripts/tests/test_persian_ocr_review_disagreement_metrics.py
      - scripts/persian_ocr_tesseract_psm_ablation.py
      - scripts/tests/test_persian_ocr_tesseract_psm_ablation.py
      - scripts/tests/test_persian_ocr_real_synthetic_workflow_policy.py
      - .github/workflows/persian-ocr-real-synthetic-probe.yml
      - .github/workflows/persian-ocr-local-metrics.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persian-ocr-metrics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-offline-measurement:
    name: Synthetic Persian OCR metrics regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact pull request source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate local-only synthetic OCR metrics and safety boundaries
        run: python -m unittest scripts.tests.test_persian_ocr_local_validation_metrics scripts.tests.test_persian_ocr_blind_cohort_preflight scripts.tests.test_persian_ocr_local_source_integrity scripts.tests.test_persian_ocr_offline_study_run scripts.tests.test_persian_ocr_review_disagreement_metrics scripts.tests.test_persian_ocr_tesseract_psm_ablation scripts.tests.test_persian_ocr_real_synthetic_workflow_policy -v
