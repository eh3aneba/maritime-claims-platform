name: PostgreSQL External Evidence Observation Refresh Concurrency

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - ".github/workflows/postgres-external-evidence-observation-refresh.yml"

permissions:
  contents: read

concurrency:
  group: external-evidence-observation-refresh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observation-refresh-concurrency:
    name: External Evidence observation refresh concurrency
    runs-on: ubuntu-latest
    # This PostgreSQL serialization proof replays the governed external-Evidence
    # lineage before exercising the exact authorization row lock. Keep a bounded
    # gate, but leave enough margin for slower hosted-runner PostgreSQL I/O.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_observation_refresh_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_observation_refresh_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_observation_refresh_ci
      MCRI_TEST_DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_observation_refresh_ci
      EXTERNAL_EVIDENCE_REFRESH_EXECUTION_POSTGRES_TEST: "1"
      SECRET_KEY: ci-only-observation-refresh-not-a-deployment-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-observation-refresh-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run observation refresh concurrency regression
        run: pytest -q tests/test_external_document_source_observation_refresh_execution_concurrency_postgres.py
