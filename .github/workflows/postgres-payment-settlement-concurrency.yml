name: PostgreSQL Payment Settlement Concurrency

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: payment-settlement-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payment-settlement-concurrency:
    name: Payment settlement concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_payment_concurrency_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_payment_concurrency_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_payment_concurrency_ci
      PAYMENT_SETTLEMENT_POSTGRES_TEST: "1"
      SECRET_KEY: ci-only-payment-concurrency-not-a-deployment-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-payment-concurrency-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run payment settlement concurrency regressions
        run: pytest -q tests/test_payment_settlement_concurrency_postgres.py
