name: Temporary AE-A Paramiko lock refresh

on:
  push:
    branches:
      - feature/sftp-production-integration-closure

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sftp-production-integration-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate production dependency lock reproducibly
        run: |
          python -m pip install --disable-pip-version-check 'pip-tools==7.6.1'
          env -u PIP_NO_INDEX pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt
      - name: Commit regenerated lock
        run: |
          if git diff --quiet -- apps/api/requirements.lock; then
            echo 'requirements.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/requirements.lock
          git commit -m 'chore(deps): regenerate Paramiko production lock [skip ci]'
          git push origin HEAD:feature/sftp-production-integration-closure
