# DISPOSABLE COORDINATOR. NEVER MERGE. No required check context is emitted.
name: CI v2 bounded hosted acceptance coordinator
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
  issues: write
concurrency:
  group: ci-v2-hosted-acceptance-coordinator
  cancel-in-progress: false
jobs:
  cohort:
    name: Pinned cohort evidence controller
    runs-on: ubuntu-latest
    timeout-minutes: 320
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - name: Resume recorded run IDs and complete bounded serial cohort
        run: python -u scripts/ci_v2_acceptance/collect_pinned_pairs.py
      - name: Preserve thin evidence checkpoint even on failure
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root=Path('scripts/ci_v2_acceptance')
          out=Path(os.environ['RUNNER_TEMP'])/'cohort-checkpoint'
          selected=list(root.glob('pair*/pair-attempt1-audit.json'))
          selected += [root/name for name in ['additional-pairs-state.json','additional-pairs-review.json','collection-component-hosted.json']]
          for p in selected:
              if p.exists():
                  target=out/p.relative_to(root)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(p,target)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cohort-checkpoint
          path: ${{ runner.temp }}/cohort-checkpoint
          if-no-files-found: error
          retention-days: 7
  expiry:
    name: Natural expiry and recovery evidence controller
    needs: cohort
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - uses: actions/download-artifact@v4
        with:
          name: cohort-checkpoint
          path: ${{ runner.temp }}/cohort-checkpoint
      - name: Observe actual recorded expiry and test retry/recollect recovery
        id: expiry
        run: python -u scripts/ci_v2_acceptance/watch_natural_expiry.py
      - name: Record evidence-based acceptance review without merging
        if: always()
        env:
          COHORT_RESULT: ${{ needs.cohort.result }}
          EXPIRY_OUTCOME: ${{ steps.expiry.outcome }}
        run: python scripts/ci_v2_acceptance/final_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-and-acceptance-review
          path: |
            scripts/ci_v2_acceptance/*expiry*.json
            scripts/ci_v2_acceptance/combined-acceptance-review.json
          if-no-files-found: error
          retention-days: 7
