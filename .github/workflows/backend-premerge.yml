name: Full Backend Pre-Merge

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify backend changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend_required: ${{ steps.scope.outputs.backend_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head change scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: Full Backend required."
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "backend_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to Full Backend."
            exit 0
          fi

          backend_required=false
          while IFS= read -r path; do
            case "$path" in
              apps/api/*|.github/workflows/backend-premerge.yml)
                backend_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "backend_required=$backend_required" >> "$GITHUB_OUTPUT"
          echo "Full Backend required: $backend_required"

  backend-shard:
    name: Backend tests group ${{ matrix.group }}
    needs: classify
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) && needs.classify.outputs.backend_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Keep the existing deterministic 64-way node partition as the atomic
        # coverage unit, but bundle those legacy buckets into 20 runner-aligned
        # execution groups. The grouping is balanced from the worst observed
        # per-shard runtime across Full Backend runs #38 and #40.
        include:
          - group: 0
            legacy_shards: "42 60"
          - group: 1
            legacy_shards: "43 11 62"
          - group: 2
            legacy_shards: "12 45"
          - group: 3
            legacy_shards: "17 44"
          - group: 4
            legacy_shards: "13 35 27"
          - group: 5
            legacy_shards: "19 52 41"
          - group: 6
            legacy_shards: "23 46 3 58"
          - group: 7
            legacy_shards: "18 29 47 61"
          - group: 8
            legacy_shards: "25 37 56 63"
          - group: 9
            legacy_shards: "4 34 50"
          - group: 10
            legacy_shards: "24 39 51"
          - group: 11
            legacy_shards: "16 36 53"
          - group: 12
            legacy_shards: "21 31 48 1"
          - group: 13
            legacy_shards: "15 30 54 0"
          - group: 14
            legacy_shards: "10 33 40"
          - group: 15
            legacy_shards: "7 9 2 57"
          - group: 16
            legacy_shards: "5 22"
          - group: 17
            legacy_shards: "26 8 38"
          - group: 18
            legacy_shards: "20 6 55 59 32"
          - group: 19
            legacy_shards: "28 14 49"
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/mcri_ci
      SECRET_KEY: ci-only-not-a-deployment-secret-change-on-every-run-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-ci-documents
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Compile backend
        run: python -m compileall app alembic

      - name: Run balanced backend test group
        shell: bash
        env:
          LEGACY_SHARDS: ${{ matrix.legacy_shards }}
        run: |
          set -euo pipefail

          read -r -a allowed_legacy_shards <<< "$LEGACY_SHARDS"

          mapfile -t test_nodes < <(
            pytest --collect-only -q tests |
              grep -E '^tests/.*::' |
              sort
          )

          total_nodes=0
          for legacy_shard in "${allowed_legacy_shards[@]}"; do
            shard_nodes=()
            for index in "${!test_nodes[@]}"; do
              if (( index % 64 == legacy_shard )); then
                shard_nodes+=("${test_nodes[$index]}")
              fi
            done

            if (( ${#shard_nodes[@]} == 0 )); then
              echo "No backend test nodes selected for legacy shard $legacy_shard" >&2
              exit 1
            fi

            total_nodes=$(( total_nodes + ${#shard_nodes[@]} ))
            printf 'Running %s backend test nodes for legacy shard %s inside group %s\n' \
              "${#shard_nodes[@]}" "$legacy_shard" "${{ matrix.group }}"

            # Keep each legacy shard in its own pytest process. This preserves
            # the isolation semantics of the proven 64-shard workflow while
            # sharing runner checkout/Python/dependency setup across the group.
            pytest -q "${shard_nodes[@]}"
          done

          printf 'Completed %s backend test nodes in group %s from legacy shards: %s\n' \
            "$total_nodes" "${{ matrix.group }}" "$LEGACY_SHARDS"

  backend:
    name: Backend tests
    needs:
      - classify
      - backend-shard
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify full backend shards succeeded
        if: ${{ needs.classify.outputs.backend_required == 'true' }}
        env:
          SHARD_RESULT: ${{ needs.backend-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Backend shard matrix result: $SHARD_RESULT" >&2
            exit 1
          fi
          echo "All balanced backend test groups succeeded for the exact pre-merge head."

      - name: Record workflow-only backend bypass
        if: ${{ needs.classify.outputs.backend_required != 'true' }}
        run: |
          echo "No backend-relevant files changed; balanced Full Backend was not required."
          echo "Required Backend tests status is satisfied by exact-head scope classification."
