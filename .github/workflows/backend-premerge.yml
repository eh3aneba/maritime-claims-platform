# Disposable controller. NEVER MERGE. No required check context is emitted.
name: Bounded current-main scheduling-order canary
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: write
  issues: write
concurrency:
  group: current-main-order-canary
  cancel-in-progress: false
jobs:
  canary:
    name: Scheduling-order evidence controller
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
      - name: Run one controlled full64 pair and audit actual scheduling effect
        run: python -u scripts/order_canary/controller.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduling-order-evidence
          path: |
            scripts/order_canary/config.json
            scripts/order_canary/state.json
            scripts/order_canary/*audit.json
            scripts/order_canary/result.json
          if-no-files-found: error
          retention-days: 7
