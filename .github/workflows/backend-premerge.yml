# Disposable collection-only proof. NEVER MERGE. Emits no required check name.
name: CI v2 collection component measurement
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  component:
    name: Synthetic-source collection component measurement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/mcri_ci
      SECRET_KEY: ci-only-collection-component-not-a-production-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ''
      LOCAL_STORAGE_PATH: /tmp/ci-v2-component-documents
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 998858f31d8c6ff8b8a2fe4b1184d787975efdf3
          path: frozen
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.17'
          cache: pip
          cache-dependency-path: frozen/apps/api/requirements-dev.lock
      - name: Install locked backend collection dependencies
        working-directory: frozen/apps/api
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check
      - name: Measure original selector versus shared manifest with exact node parity
        run: python scripts/ci_v2_collection_component.py
      - uses: actions/upload-artifact@v4
        with:
          name: collection-component
          path: ${{ runner.temp }}/collection-component.json
          if-no-files-found: error
          retention-days: 7
