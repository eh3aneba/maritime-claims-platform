# DISPOSABLE SYNTHETIC PROOF BRANCH. NEVER MERGE THIS WORKFLOW INTO MAIN.
# No required GitHub check name is emitted. This does not validate backend coverage.
name: CI v2 isolated hosted failure proof
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: artifact-cases
        options: [artifact-cases, producer-failure, rerun-recovery, expired-artifact, post-expiry-recovery]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-v2-isolated-proof-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false
jobs:
  producer:
    name: Synthetic proof producer
    if: inputs.mode != 'expired-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.produce.outputs.digest }}
      artifact: ${{ steps.produce.outputs.artifact }}
      origin_run: ${{ steps.produce.outputs.origin_run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 998858f31d8c6ff8b8a2fe4b1184d787975efdf3
          path: frozen
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Produce using unchanged selector CLI and synthetic collector
        id: produce
        env:
          PROOF_CASE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_v2_isolated_proof.py produce --case "$PROOF_CASE"
      - uses: actions/upload-artifact@v4
        if: inputs.mode != 'post-expiry-recovery' || github.run_attempt != 1
        with:
          name: ${{ steps.produce.outputs.artifact }}
          path: ${{ runner.temp }}/proof-manifest/backend-nodes.json
          if-no-files-found: error
          retention-days: 1
  consumer:
    name: Synthetic proof consumer ${{ matrix.case }}
    needs: producer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        case: [valid, corrupt, wrong-digest, stale, wrong-tree, duplicate, missing-node, missing-artifact]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 998858f31d8c6ff8b8a2fe4b1184d787975efdf3
          path: frozen
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download real hosted fixture artifact
        id: download
        continue-on-error: ${{ matrix.case == 'missing-artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.case == 'missing-artifact' && 'deliberately-absent-proof-artifact' || needs.producer.outputs.artifact }}
          path: ${{ runner.temp }}/proof-manifest
          run-id: ${{ needs.producer.outputs.origin_run }}
          github-token: ${{ github.token }}
      - name: Verify expected download behavior
        env:
          PROOF_CASE: ${{ matrix.case }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          if [ "$PROOF_CASE" = missing-artifact ]; then
            test "$DOWNLOAD_OUTCOME" = failure
          else
            test "$DOWNLOAD_OUTCOME" = success
          fi
      - name: Prove unchanged consumer rejection or acceptance
        env:
          MANIFEST_SHA256: ${{ needs.producer.outputs.digest }}
          PROOF_CASE: ${{ matrix.case }}
        run: python scripts/ci_v2_isolated_proof.py consume --case "$PROOF_CASE"
      - name: Inject one recoverable synthetic failure on first attempt only
        if: ${{ (inputs.mode == 'rerun-recovery' || inputs.mode == 'post-expiry-recovery') && matrix.case == 'valid' && github.run_attempt == 1 }}
        run: exit 19
  proof:
    name: Synthetic dependency and gate proof
    needs: [producer, consumer]
    if: always() && inputs.mode != 'expired-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 998858f31d8c6ff8b8a2fe4b1184d787975efdf3
          path: frozen
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Prove original aggregate shell rejects actual failed dependencies
        env:
          PROOF_MODE: ${{ inputs.mode }}
          CLASSIFIER_RESULT: success
          FULL_REQUIRED: 'true'
          NARROW_REQUIRED: 'false'
          COLLECTION_RESULT: ${{ needs.producer.result }}
          SHARD_RESULT: ${{ needs.consumer.result }}
          NARROW_RESULT: skipped
        run: python scripts/ci_v2_isolated_proof.py gate
      - name: Run immutable source-only safety regressions
        working-directory: frozen
        run: python -m unittest scripts.tests.test_backend_shard_selector -v
  expired:
    name: Natural-expiry artifact availability proof
    if: inputs.mode == 'expired-artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the recorded expiry time and unchanged originating attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYEXPIRY'
          from datetime import datetime, timezone
          expiry = datetime.fromisoformat('2026-11-03T14:45:43+00:00')
          if datetime.now(timezone.utc) < expiry:
              raise SystemExit('Not naturally expired yet; no expiry proof is claimed.')
          PYEXPIRY
          attempt="$(gh api repos/eh3aneba/maritime-claims-platform/actions/runs/41389632800 --jq .run_attempt)"
          test "$attempt" = 2
      - name: Attempt real download after recorded natural expiry
        id: expired_download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: backend-collection-2
          run-id: 41389632800
          github-token: ${{ github.token }}
          repository: eh3aneba/maritime-claims-platform
          path: ${{ runner.temp }}/expired-proof
      - name: Require unavailable artifact after natural expiry
        env:
          DOWNLOAD_OUTCOME: ${{ steps.expired_download.outcome }}
        run: test "$DOWNLOAD_OUTCOME" = failure
