name: Operational Performance Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify operational performance scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      performance_required: ${{ steps.scope.outputs.performance_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head performance scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "performance_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: operational performance validation required."
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "performance_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to operational performance validation."
            exit 0
          fi

          # Fail-closed, auditable path classification. Standalone offline
          # release/monitoring/rollback evidence-record helpers need focused
          # tests but do not need to boot the full Docker+ClamAV stack.
          # Any mixed, unknown, runtime, dependency, Compose, or workflow
          # change still requires the real synthetic stack validation.
          python scripts/pilot_performance_scope.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"

  performance-smoke:
    name: Live-stack performance smoke
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.performance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile performance harness
        run: python -m py_compile scripts/operational_performance_smoke.py

      - name: Prepare isolated performance environment
        run: |
          umask 077
          PERF_DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          PERF_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          PERF_DEMO_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PERF_DB_PASSWORD"
          echo "::add-mask::$PERF_SECRET_KEY"
          echo "::add-mask::$PERF_DEMO_PASSWORD"
          cat > .env.performance <<EOF
          APP_ENV=test
          APP_NAME="Maritime Claims & Risk Intelligence Platform"
          API_V1_PREFIX=/api/v1
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:3000
          POSTGRES_DB=mcri_performance
          POSTGRES_USER=mcri_performance
          POSTGRES_PASSWORD=$PERF_DB_PASSWORD
          DATABASE_URL=postgresql+psycopg://mcri_performance:$PERF_DB_PASSWORD@db:5432/mcri_performance
          SECRET_KEY=$PERF_SECRET_KEY
          STORAGE_BACKEND=local
          LOCAL_STORAGE_PATH=/data/documents
          MALWARE_SCAN_ENABLED=true
          MCRI_SYNTHETIC_ONLY_CONFIRM=YES
          PROCESSING_MAX_ATTEMPTS=1
          AI_PROVIDER=disabled
          AI_MODEL=
          OPENAI_API_KEY=
          ALLOW_EXTERNAL_AI_RESTRICTED=false
          MCRI_DEMO_ORG_NAME="CI Performance Marine Insurer"
          MCRI_DEMO_ORG_SLUG=pilot
          MCRI_DEMO_EMAIL=manager@demo.mcri.app
          MCRI_DEMO_PASSWORD=$PERF_DEMO_PASSWORD
          EOF

      - name: Start and validate design-partner stack
        run: |
          set -o pipefail
          bash scripts/design_partner_preflight.sh .env.performance 2>&1 \
            | sed -E \
                -e 's/^User:.*/User: [redacted]/' \
                -e 's/^Claim:.*/Claim: [synthetic-seed-verified]/'

      # Check the effective identity of the RUNNING web process, not merely
      # the image Dockerfile. Verify only the Next cache is writable to UID
      # 1000; server.js, prerendered server files and public assets stay read-only.
      - name: Verify live Web container non-root runtime and write boundary
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.performance exec -T web sh -eu -c '
            [ "$(id -u)" = "1000" ]
            [ "$(id -g)" = "1000" ]
            [ -w /app/.next/cache ]
            [ ! -w /app/server.js ]
            [ ! -w /app/.next/server ]
            [ ! -w /app/public ]
            # Check process 1, not just the shell used by docker exec.
            # Drop all Linux capabilities; forbid gaining privileges at exec.
            awk '\''$1 == "CapEff:" {seen=1; if ($2 != "0000000000000000") exit 1} END {if (!seen) exit 1}'\'' /proc/1/status
            awk '\''$1 == "NoNewPrivs:" {seen=1; if ($2 != "1") exit 1} END {if (!seen) exit 1}'\'' /proc/1/status
          '
          echo "PASS: Web is non-root, has no effective Linux capabilities, and cannot gain new privileges; application files are read-only."
          echo "Does not attest API, Worker, host mount or external pilot security."

      # DB-only workers have no Evidence volume or OCR needs. Assert the
      # effective main process security boundary AND real read-only SQL access.
      # Do not claim API/document worker or host custody are hardened.
      - name: Verify live non-root governance and Evidence worker DB access
        shell: bash
        run: |
          set -euo pipefail
          for service in \
              governance-webhook-worker \
              external-evidence-scheduler-worker \
              external-evidence-observation-worker \
              external-evidence-review-projector-worker; do
            docker compose --env-file .env.performance exec -T "$service" python - <<'PY'
          try:
              import os
              from pathlib import Path
              from sqlalchemy import text
              from app.db.session import create_session
              pairs = {}
              for line in Path("/proc/1/status").read_text().splitlines():
                  if ":" in line:
                      name, value = line.split(":", 1)
                      pairs[name] = value.split()
              assert pairs["Uid"] == ["1000"] * 4
              assert pairs["Gid"] == ["1000"] * 4
              assert pairs["CapEff"] == ["0000000000000000"]
              assert pairs["NoNewPrivs"] == ["1"]
              assert os.geteuid() == 1000 and os.getegid() == 1000
              assert not os.access("/app/app", os.W_OK)
              with create_session() as db:
                  assert db.execute(text("SELECT 1")).scalar_one() == 1
          except Exception:
              raise SystemExit("NO-GO: DB-only worker runtime or read-only SQL check failed")
          PY
          done
          echo "PASS: four DB-only workers run as UID/GID 1000 with CapEff=0, NoNewPrivs=1 and read-only SQL."

      # Alembic already ran at bootstrap. Verify the one-shot migration image
      # under the same Compose security context without rerunning migrations,
      # modifying the database, or touching any Evidence volume.
      - name: Verify unprivileged migration image and read-only DB access
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.performance run --rm --no-deps -T migrate python - <<'PY'
          try:
              import os
              from pathlib import Path
              from sqlalchemy import text
              from app.db.session import create_session
              fields = {}
              for line in Path("/proc/1/status").read_text().splitlines():
                  if ":" in line:
                      key, value = line.split(":", 1)
                      fields[key] = value.split()
              assert fields["Uid"] == ["1000"] * 4
              assert fields["Gid"] == ["1000"] * 4
              assert fields["CapEff"] == ["0000000000000000"]
              assert fields["NoNewPrivs"] == ["1"]
              assert os.geteuid() == 1000 and os.getegid() == 1000
              assert not os.access("/app/alembic", os.W_OK)
              with create_session() as db:
                  assert db.execute(text("SELECT 1")).scalar_one() == 1
          except Exception:
              raise SystemExit("NO-GO: migration user privileges or read-only DB check failed")
          PY
          echo "PASS: actual migration image runs as UID/GID 1000 with CapEff=0 and NoNewPrivs=1."
          echo "Not evidence of existing-volume ownership or a real customer host."

      # Use the actual seeded synthetic Evidence volume to prove the
      # read-only UID 1000 precheck's behavior before any API/OCR user change.
      # A declared NO-GO for a root-owned legacy mount is the EXPECTED safe
      # outcome, not permission to chown it or bypass the check.
      - name: Verify mounted synthetic Evidence volume UID precheck without mutation
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.performance exec -T api python - <<'PY'
          try:
              import stat
              from pathlib import Path
              from app.core.config import get_settings
              from app.core.evidence_volume_uid_audit import (
                  EvidencePermissionAuditError, _mode_allows, audit_evidence_tree,
              )
              settings = get_settings()
              assert settings.storage_backend.strip().lower() == "local"
              root = Path(settings.local_storage_path)
              before = root.lstat()
              assert stat.S_ISDIR(before.st_mode)
              root_permissions_compatible = _mode_allows(before, 1000, 1000, 7)
              result = "pass"
              try:
                  assert audit_evidence_tree(root) >= 1
              except EvidencePermissionAuditError as exc:
                  result = str(exc)
              valid_reasons = {
                  "directory_permissions", "file_permissions",
                  "unsafe_ancestor", "symlink_detected",
                  "world_writable_entry", "unsupported_entry",
                  "scan_limit_exceeded",
              }
              assert result == "pass" or result in valid_reasons
              # If the actual mount is not writable by the proposed UID,
              # the audit MUST NOT misreport it as compatible.
              if not root_permissions_compatible:
                  assert result == "directory_permissions"
              after = root.lstat()
              assert (before.st_dev, before.st_ino, before.st_mode,
                      before.st_uid, before.st_gid) == (
                      after.st_dev, after.st_ino, after.st_mode,
                      after.st_uid, after.st_gid)
              print("PASS: mounted synthetic Evidence metadata precheck is fail-closed.")
              print("Neither actual UID access nor legacy customer migration is approved.")
          except Exception:
              raise SystemExit("NO-GO: mounted synthetic Evidence precheck contract failed")
          PY

      # Proof of actual UID 1000 cross-service write/read/rename/unlink
      # on a NEW CI-only scratch bind mount. Do NOT change or probe-write the
      # existing local_documents volume; existing customer volumes remain NO-GO.
      - name: Verify unprivileged API and OCR worker synthetic scratch custody
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d "$RUNNER_TEMP/mcri-uid-scratch.XXXXXXXX")"
          trap 'sudo rm -rf -- "$scratch"' EXIT
          sudo chown 1000:1000 "$scratch"
          sudo chmod 0700 "$scratch"
          docker compose --env-file .env.performance run --rm --no-deps -T \
            --user 1000:1000 -v "$scratch:/mnt/mcri-ci-uid-probe:rw" \
            api python - <<'PY'
          import os
          from pathlib import Path
          from stat import S_IMODE
          root = Path("/mnt/mcri-ci-uid-probe")
          assert os.geteuid() == os.getegid() == 1000
          assert root.is_dir() and root.stat().st_uid == 1000
          assert S_IMODE(root.stat().st_mode) == 0o700
          assert not os.access("/app/app", os.W_OK)
          marker = root / "cross-service-synthetic-marker"
          fd = os.open(marker, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
          with os.fdopen(fd, "wb") as dest:
              dest.write(b"synthetic-noncustomer-evidence")
          assert marker.read_bytes() == b"synthetic-noncustomer-evidence"
          assert S_IMODE(marker.stat().st_mode) & 0o077 == 0
          # Exercise the real production local-admission implementation with
          # a synthetic PDF. No DB transaction, customer file or real volume.
          import asyncio
          import hashlib
          from io import BytesIO
          from fastapi import UploadFile
          from app.modules.documents.storage import LocalDocumentStorage, UploadTooLarge
          store = LocalDocumentStorage(str(root), max_upload_bytes=1024)
          payload = b"%PDF-1.4\n% synthetic-ci-only\n%%EOF\n"
          stored = asyncio.run(store.save_upload(
              UploadFile(file=BytesIO(payload), filename="synthetic.pdf"),
              "_quarantine/ci/synthetic.pdf",
          ))
          assert stored.file_size_bytes == len(payload)
          assert stored.file_hash == hashlib.sha256(payload).hexdigest()
          assert store.path_for(stored.storage_key).read_bytes() == payload
          assert S_IMODE(store.path_for(stored.storage_key).stat().st_mode) == 0o600
          # Fail closed after a fully streamed upload when the key exists.
          # Private upload staging files must never remain after failure.
          try:
              asyncio.run(store.save_upload(
                  UploadFile(file=BytesIO(b"synthetic-collision"), filename="collision.pdf"),
                  stored.storage_key,
              ))
              raise AssertionError("NO-GO: colliding upload replaced Evidence")
          except FileExistsError:
              pass
          assert store.path_for(stored.storage_key).read_bytes() == payload
          # A rejected oversized upload must leave no Evidence and no partial.
          try:
              asyncio.run(LocalDocumentStorage(
                  str(root), max_upload_bytes=4,
              ).save_upload(
                  UploadFile(file=BytesIO(payload), filename="oversized.pdf"),
                  "_quarantine/ci/oversized.pdf",
              ))
              raise AssertionError("NO-GO: oversized upload was admitted")
          except UploadTooLarge:
              pass
          assert not (root / "_quarantine/ci/oversized.pdf").exists()
          assert not list((root / "_quarantine/ci").glob(".mcri-upload-*.partial"))
          PY
          docker compose --env-file .env.performance run --rm --no-deps -T \
            --user 1000:1000 -v "$scratch:/mnt/mcri-ci-uid-probe:rw" \
            worker python - <<'PY'
          import os
          import struct
          import subprocess
          import zlib
          from pathlib import Path
          root = Path("/mnt/mcri-ci-uid-probe")
          assert os.geteuid() == os.getegid() == 1000
          assert not os.access("/app/app", os.W_OK)
          marker = root / "cross-service-synthetic-marker"
          assert marker.read_bytes() == b"synthetic-noncustomer-evidence"
          moved = root / "cross-service-synthetic-processed"
          marker.rename(moved)
          assert moved.read_bytes() == b"synthetic-noncustomer-evidence"
          moved.unlink()
          # The document worker must access the API-created quarantine file
          # through the same real LocalDocumentStorage custody methods.
          from app.modules.documents.storage import LocalDocumentStorage, StorageError
          store = LocalDocumentStorage(str(root), max_upload_bytes=1024)
          source_key = "_quarantine/ci/synthetic.pdf"
          target_key = "tenant/claim/synthetic.pdf"
          existing_key = "tenant/claim/existing.pdf"
          untouched = b"synthetic-foreign-original"
          store.save_bytes(untouched, existing_key)
          try:
              store.promote(source_key, existing_key)
              raise AssertionError("NO-GO: existing Evidence was overwritten")
          except StorageError:
              pass
          assert store.path_for(existing_key).read_bytes() == untouched
          assert store.path_for(source_key).read_bytes().startswith(b"%PDF-1.4")
          store.promote(source_key, target_key)
          assert not (root / source_key).exists()
          assert store.path_for(target_key).read_bytes().startswith(b"%PDF-1.4")
          try:
              store.save_bytes(b"unsafe-collision", target_key)
              raise AssertionError("NO-GO: Evidence save collision was allowed")
          except FileExistsError:
              pass
          assert store.path_for(target_key).read_bytes().startswith(b"%PDF-1.4")
          store.delete_physical(target_key)
          store.delete_physical(existing_key)
          for directory in ("_quarantine/ci", "_quarantine", "tenant/claim", "tenant"):
              (root / directory).rmdir()
          def chunk(kind, data):
              blob = kind + data
              return struct.pack(">I", len(data)) + blob + struct.pack(">I", zlib.crc32(blob) & 0xffffffff)
          rows = b"".join(b"\x00" + b"\xff\xff\xff" * 80 for _ in range(64))
          png = (b"\x89PNG\r\n\x1a\n"
                 + chunk(b"IHDR", struct.pack(">IIBBBBB", 80, 64, 8, 2, 0, 0, 0))
                 + chunk(b"IDAT", zlib.compress(rows))
                 + chunk(b"IEND", b""))
          image = root / "synthetic-ci-ocr.png"
          with image.open("xb") as out:
              out.write(png)
          for args in (
              ["tesseract", str(image), "stdout", "-l", "eng+fas"],
              ["pdftotext", "-v"],
              ["pdftoppm", "-v"],
          ):
              result = subprocess.run(args, capture_output=True, timeout=45, check=False)
              assert result.returncode == 0
          image.unlink()
          PY
          if [ -n "$(sudo find "$scratch" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::Synthetic UID scratch custody was not cleaned up."
            exit 1
          fi
          echo "PASS: effective UID 1000 API/worker exercised private LocalDocumentStorage upload, quarantine promotion, collision refusal and cleanup on isolated synthetic scratch; eng+fas OCR tools execute."
          echo "NOT a real authenticated API upload, scanner admission, legacy Evidence volume migration or customer-host approval."

      # The real synthetic project is now populated; prove the read-only
      # admission check DENIES it. Never rerun side-effecting demo seed.
      - name: Reject re-seed against live populated Compose project
        run: |
          set -euo pipefail
          set +e
          outcome="$(python scripts/pilot_demo_empty_stack.py --env-file .env.performance 2>&1)"
          exit_status=$?
          set -e
          if [ "$exit_status" -ne 2 ] || \
             [ "$outcome" != "NO-GO: Compose project already contains containers" ]; then
            echo "::error::Live synthetic pre-seed refusal was not proven (unexpected result)."
            exit 1
          fi
          echo "PASS: already-populated synthetic project rejected by read-only seed guard."
          echo "Not a proof of host isolation, restore, rollback or Pilot GO."

      # This observes the *actual synthetic CI Compose stack* after preflight.
      # It must not start/alter services or substitute for a fresh-host Pilot drill.
      - name: Verify live synthetic Compose service readiness
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python scripts/pilot_compose_readiness.py \
            --env-file .env.performance \
            --release-sha "$CANDIDATE_SHA" \
            --output artifacts/compose-readiness.json

      # Live production scanner API, synthetic clean file + harmless EICAR
      # signature only. Fails closed and never records the bytes or response.
      - name: Verify live synthetic ClamAV scan boundary
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python scripts/pilot_live_clamav_probe.py \
            --env-file .env.performance \
            --release-sha "$CANDIDATE_SHA" \
            --output artifacts/clamav-synthetic-probe.json

      - name: Run bounded operational performance smoke
        run: |
          set -a
          source .env.performance
          set +a
          export MCRI_API_URL=http://127.0.0.1:8000/api/v1
          export MCRI_PERF_OUTPUT=artifacts/performance-smoke.json
          export MCRI_PERF_WARMUP_REQUESTS=3
          export MCRI_PERF_SAMPLE_REQUESTS=24
          export MCRI_PERF_CONCURRENCY=4
          export MCRI_PERF_MAX_ERROR_RATIO=0
          export MCRI_PERF_LIVENESS_P95_MS=1000
          export MCRI_PERF_READINESS_P95_MS=1500
          export MCRI_PERF_CLAIM_LIST_P95_MS=2500
          python scripts/operational_performance_smoke.py

      # This verifies a real custom-format PostgreSQL dump/sidecars, archives
      # synthetic Evidence and restores into a NEW isolated CI-only database.
      # Never invokes the destructive application DB restore procedure.
      - name: Verify synthetic backup and isolated database clone restore
        env:
          MCRI_CI_RESTORE_PROBE: "1"
          MCRI_CI_CROSS_RUNNER_EXPORT: "1"
        run: |
          set -euo pipefail
          set -a
          source .env.performance
          set +a
          export COMPOSE_ENV_FILES=.env.performance
          python scripts/pilot_ci_restore_probe.py \
            --env-file .env.performance \
            --output artifacts/synthetic-db-restore-probe.json \
            --cross-runner-output synthetic-recovery-transfer

      # After the recovery checker stops writers and reconciles the synthetic
      # DB clone/Evidence, restart the EXISTING ephemeral application writers
      # and re-prove healthy Compose + real HTTP readiness + authenticated
      # MT ORION API access. This is not a rollback or production deployment.
      - name: Verify synthetic post-recovery service restart and claim read
        env:
          MCRI_CI_RESUME_PROBE: "1"
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          set -a
          source .env.performance
          set +a
          export COMPOSE_ENV_FILES=.env.performance
          python scripts/pilot_ci_resume_probe.py \
            --env-file .env.performance \
            --release-sha "$CANDIDATE_SHA" \
            --output artifacts/synthetic-post-recovery-resume.json

      # All bytes are CI-only synthetic fixtures and this archive is short lived.
      # Upload only after full local verification and post-recovery API success.
      # A DIFFERENT GitHub-hosted job will download it onto a separate VM.
      - name: Transfer synthetic recovery pair to fresh CI runner
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recovery-transfer
          path: synthetic-recovery-transfer/
          if-no-files-found: error
          retention-days: 1

      - name: Capture bounded container diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env.performance ps -a > artifacts/performance-docker-compose-ps.txt || true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-performance-smoke
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove performance containers and volumes
        if: always()
        run: docker compose --env-file .env.performance down -v --remove-orphans || true

  cross-runner-restore:
    name: Fresh CI runner synthetic recovery gate
    needs:
      - classify
      - performance-smoke
    if: ${{ needs.classify.outputs.performance_required == 'true' && needs.performance-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download transferred synthetic recovery pair
        uses: actions/download-artifact@v4
        with:
          name: synthetic-recovery-transfer
          path: synthetic-recovery-transfer

      - name: Independently verify and restore on distinct ephemeral runner
        shell: bash
        env:
          APP_ENV: test
          POSTGRES_DB: mcri_performance
          POSTGRES_USER: mcri_performance
          MCRI_CI_RESTORE_PROBE: "1"
          MCRI_CI_CROSS_RUNNER_RESTORE: "1"
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p artifacts
          POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$POSTGRES_PASSWORD"
          export POSTGRES_PASSWORD
          python scripts/pilot_ci_cross_runner_transfer.py \
            --sha "$CANDIDATE_SHA" \
            --input synthetic-recovery-transfer \
            --output artifacts/cross-runner-restore.json

      - name: Upload bounded distinct-runner recovery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-cross-runner-recovery-proof
          path: artifacts/cross-runner-restore.json
          if-no-files-found: ignore
          retention-days: 7

  performance-gate:
    name: Operational performance gate
    needs:
      - classify
      - performance-smoke
      - cross-runner-restore
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce classified operational performance scope
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PERFORMANCE_REQUIRED: ${{ needs.classify.outputs.performance_required }}
          PERFORMANCE_RESULT: ${{ needs.performance-smoke.result }}
          CROSS_RUNNER_RESULT: ${{ needs.cross-runner-restore.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::Operational performance scope classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          if [ "$PERFORMANCE_REQUIRED" = "true" ]; then
            if [ "$PERFORMANCE_RESULT" != "success" ]; then
              echo "::error::Live-stack performance smoke was required but finished with result: $PERFORMANCE_RESULT"
              exit 1
            fi
            if [ "$CROSS_RUNNER_RESULT" != "success" ]; then
              echo "::error::Cross-runner synthetic DB/Evidence recovery was required but finished with result: $CROSS_RUNNER_RESULT"
              exit 1
            fi
          else
            if [ "$CROSS_RUNNER_RESULT" != "skipped" ]; then
              echo "::error::Cross-runner restore unexpectedly ran or failed for a scope-skipped PR: $CROSS_RUNNER_RESULT"
              exit 1
            fi
            case "$PERFORMANCE_RESULT" in
              skipped|success)
                ;;
              *)
                echo "::error::Live-stack performance smoke was not required but finished unexpectedly with result: $PERFORMANCE_RESULT"
                exit 1
                ;;
            esac
          fi

          echo "Operational performance gate passed."

