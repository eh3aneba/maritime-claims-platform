name: Operational Performance Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify operational performance scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      performance_required: ${{ steps.scope.outputs.performance_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head performance scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "performance_required=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: operational performance validation required."
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "performance_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to operational performance validation."
            exit 0
          fi

          performance_required=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/api/*|apps/web/*|scripts/*|docker-compose*.yml|.github/workflows/performance-smoke.yml)
                performance_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "performance_required=$performance_required" >> "$GITHUB_OUTPUT"
          echo "Operational performance validation required: $performance_required"

  performance-smoke:
    name: Live-stack performance smoke
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.performance_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Compile performance harness
        run: python -m py_compile scripts/operational_performance_smoke.py

      - name: Prepare isolated performance environment
        run: |
          umask 077
          PERF_DB_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          PERF_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          PERF_DEMO_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$PERF_DB_PASSWORD"
          echo "::add-mask::$PERF_SECRET_KEY"
          echo "::add-mask::$PERF_DEMO_PASSWORD"
          cat > .env.performance <<EOF
          APP_ENV=test
          APP_NAME="Maritime Claims & Risk Intelligence Platform"
          API_V1_PREFIX=/api/v1
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:3000
          POSTGRES_DB=mcri_performance
          POSTGRES_USER=mcri_performance
          POSTGRES_PASSWORD=$PERF_DB_PASSWORD
          DATABASE_URL=postgresql+psycopg://mcri_performance:$PERF_DB_PASSWORD@db:5432/mcri_performance
          SECRET_KEY=$PERF_SECRET_KEY
          STORAGE_BACKEND=local
          LOCAL_STORAGE_PATH=/data/documents
          PROCESSING_MAX_ATTEMPTS=1
          AI_PROVIDER=disabled
          AI_MODEL=
          OPENAI_API_KEY=
          ALLOW_EXTERNAL_AI_RESTRICTED=false
          MCRI_DEMO_ORG_NAME="CI Performance Marine Insurer"
          MCRI_DEMO_ORG_SLUG=pilot
          MCRI_DEMO_EMAIL=manager@demo.mcri.app
          MCRI_DEMO_PASSWORD=$PERF_DEMO_PASSWORD
          EOF

      - name: Start and validate design-partner stack
        run: |
          set -o pipefail
          bash scripts/design_partner_preflight.sh .env.performance 2>&1 \
            | sed -E \
                -e 's/^User:.*/User: [redacted]/' \
                -e 's/^Claim:.*/Claim: [synthetic-seed-verified]/'

      - name: Run bounded operational performance smoke
        run: |
          set -a
          source .env.performance
          set +a
          export MCRI_API_URL=http://127.0.0.1:8000/api/v1
          export MCRI_PERF_OUTPUT=artifacts/performance-smoke.json
          export MCRI_PERF_WARMUP_REQUESTS=3
          export MCRI_PERF_SAMPLE_REQUESTS=24
          export MCRI_PERF_CONCURRENCY=4
          export MCRI_PERF_MAX_ERROR_RATIO=0
          export MCRI_PERF_LIVENESS_P95_MS=1000
          export MCRI_PERF_READINESS_P95_MS=1500
          export MCRI_PERF_CLAIM_LIST_P95_MS=2500
          python scripts/operational_performance_smoke.py

      - name: Capture bounded container diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env.performance ps -a > artifacts/performance-docker-compose-ps.txt || true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-performance-smoke
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove performance containers and volumes
        if: always()
        run: docker compose --env-file .env.performance down -v --remove-orphans || true

  performance-gate:
    name: Operational performance gate
    needs:
      - classify
      - performance-smoke
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce classified operational performance scope
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          PERFORMANCE_REQUIRED: ${{ needs.classify.outputs.performance_required }}
          PERFORMANCE_RESULT: ${{ needs.performance-smoke.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::Operational performance scope classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          if [ "$PERFORMANCE_REQUIRED" = "true" ]; then
            if [ "$PERFORMANCE_RESULT" != "success" ]; then
              echo "::error::Live-stack performance smoke was required but finished with result: $PERFORMANCE_RESULT"
              exit 1
            fi
          else
            case "$PERFORMANCE_RESULT" in
              skipped|success)
                ;;
              *)
                echo "::error::Live-stack performance smoke was not required but finished unexpectedly with result: $PERFORMANCE_RESULT"
                exit 1
                ;;
            esac
          fi

          echo "Operational performance gate passed."

