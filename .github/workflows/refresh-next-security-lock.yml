name: Refresh Next.js Security Lock

on:
  push:
    branches:
      - feature/sftp-nplus1-release-baseline-transition
    paths:
      - ".github/workflows/refresh-next-security-lock.yml"

permissions:
  contents: write

jobs:
  refresh-next:
    name: Refresh Next.js package lock
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Cleanup temporary Next.js security lock workflow') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/sftp-nplus1-release-baseline-transition
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Refresh Next.js security pin
        working-directory: apps/web
        run: |
          npm pkg set dependencies.next=16.3.8
          npm install --package-lock-only --ignore-scripts

      - name: Validate package delta and audit
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./apps/web/package.json'); if(p.dependencies.next!=='16.3.8') process.exit(1)"
          node -e "const l=require('./apps/web/package-lock.json'); if(l.packages['node_modules/next'].version!=='16.3.8') process.exit(1)"
          (cd apps/web && npm audit --omit=dev --audit-level=high)
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "apps/web/package-lock.json"
          test "${changed[1]}" = "apps/web/package.json"

      - name: Commit refreshed web dependency files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git commit -m 'Security: bump Next.js to 16.3.8'
          git push origin HEAD:feature/sftp-nplus1-release-baseline-transition
