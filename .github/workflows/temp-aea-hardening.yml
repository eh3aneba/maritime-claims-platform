name: Temporary AE-A hardening

on:
  push:
    branches:
      - feature/sftp-production-integration-closure

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sftp-production-integration-closure
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded AE-A hardening
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected patch anchor missing: {path}')
              p.write_text(text.replace(old, new, 1))

          live = 'apps/api/app/modules/external_document_sources/live_sftp_adapters.py'
          replace_exact(
              live,
              '_ALLOWED_AUTH_KINDS = frozenset({"password", "private_key"})\n',
              '_ALLOWED_AUTH_KINDS = frozenset({"password", "private_key"})\n_LIVE_SFTP_ADAPTERS_REGISTERED = False\n\n\ndef live_sftp_registration_ready() -> bool:\n    """Return startup registration state only; performs no provider or secret I/O."""\n    return _LIVE_SFTP_ADAPTERS_REGISTERED\n',
          )
          replace_exact(
              live,
              'def _modified_at(value: int | float | None) -> datetime | None:\n',
              '''def _opened_file_identity_failure(pre_open, opened) -> str | None:\n    required = ("st_mode", "st_size")\n    if any(not isinstance(getattr(pre_open, field, None), int) for field in required):\n        return "opened_file_identity_unverifiable"\n    if any(not isinstance(getattr(opened, field, None), int) for field in required):\n        return "opened_file_identity_unverifiable"\n\n    pre_mode = getattr(pre_open, "st_mode")\n    opened_mode = getattr(opened, "st_mode")\n    if _entry_kind(pre_mode) != "file" or _entry_kind(opened_mode) != "file":\n        return "opened_file_identity_changed"\n    if pre_mode != opened_mode or getattr(pre_open, "st_size") != getattr(opened, "st_size"):\n        return "opened_file_identity_changed"\n\n    for field in ("st_mtime", "st_uid", "st_gid"):\n        before = getattr(pre_open, field, None)\n        after = getattr(opened, field, None)\n        if before is not None and after is not None and before != after:\n            return "opened_file_identity_changed"\n    return None\n\n\ndef _modified_at(value: int | float | None) -> datetime | None:\n''',
          )
          replace_exact(
              live,
              '''            with session.sftp.open(path, mode="rb") as handle:\n                try:\n                    handle.settimeout(\n''',
              '''            with session.sftp.open(path, mode="rb") as handle:\n                try:\n                    opened_attr = handle.stat()\n                except Exception as exc:\n                    raise _SftpRuntimeFailure("opened_file_identity_unverifiable") from exc\n                identity_failure = _opened_file_identity_failure(attr, opened_attr)\n                if identity_failure is not None:\n                    raise _SftpRuntimeFailure(identity_failure)\n                try:\n                    handle.settimeout(\n''',
          )
          replace_exact(
              live,
              '''    _paramiko()\n    runtime = runtime or LiveSftpRuntime()\n''',
              '''    global _LIVE_SFTP_ADAPTERS_REGISTERED\n    _LIVE_SFTP_ADAPTERS_REGISTERED = False\n    _paramiko()\n    runtime = runtime or LiveSftpRuntime()\n''',
          )
          replace_exact(
              live,
              '''    register_external_document_source_sftp_file_content_read_adapter(\n        _SftpContentReadAdapter(runtime)\n    )\n    return runtime\n''',
              '''    register_external_document_source_sftp_file_content_read_adapter(\n        _SftpContentReadAdapter(runtime)\n    )\n    _LIVE_SFTP_ADAPTERS_REGISTERED = True\n    return runtime\n''',
          )

          test_live = 'apps/api/tests/test_external_document_source_live_sftp_adapters.py'
          replace_exact(
              test_live,
              '''    def read(self, size):\n        self.read_calls += 1\n''',
              '''    def stat(self):\n        return SimpleNamespace(\n            st_mode=stat.S_IFREG | 0o640,\n            st_size=len(self._body),\n            st_mtime=1_796_000_000,\n            st_uid=1000,\n            st_gid=1000,\n        )\n\n    def read(self, size):\n        self.read_calls += 1\n''',
          )
          anchor = '''def test_live_sftp_exact_metadata_rejects_symlink_without_following_it(\n'''
          drift_test = '''def test_live_sftp_content_read_rejects_post_open_identity_drift_before_read(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    runtime = LiveSftpRuntime(secret_runtime=_SecretRuntime({}))\n    sftp = _FakeSftp(body=b"verified-evidence")\n    session = _FakeSession(sftp)\n    monkeypatch.setattr(runtime, "_open_session", lambda **_kwargs: session)\n    sftp.handle.stat = lambda: SimpleNamespace(\n        st_mode=stat.S_IFREG | 0o640,\n        st_size=len(sftp.body) + 1,\n        st_mtime=1_796_000_000,\n        st_uid=1000,\n        st_gid=1000,\n    )\n\n    result = runtime.read_content(_read_request())\n\n    assert result.content is None\n    assert result.failure_code == "opened_file_identity_changed"\n    assert result.remote_stat_performed is True\n    assert result.remote_read_performed is False\n    assert sftp.handle.read_calls == 0\n    assert session.closed is True\n\n\n'''
          replace_exact(test_live, anchor, drift_test + anchor)
          replace_exact(
              test_live,
              '''    runtime = register_live_sftp_adapters(LiveSftpRuntime(secret_runtime=_SecretRuntime({})))\n''',
              '''    monkeypatch.setattr(live, "_LIVE_SFTP_ADAPTERS_REGISTERED", False)\n    runtime = register_live_sftp_adapters(LiveSftpRuntime(secret_runtime=_SecretRuntime({})))\n    assert live.live_sftp_registration_ready() is True\n''',
          )

          health = Path('apps/api/app/modules/health/router.py')
          health.write_text('''from datetime import UTC, datetime\n\nfrom fastapi import APIRouter, Response, status\nfrom sqlalchemy import text\n\nfrom app.core.config import get_settings\nfrom app.db.session import create_session\nfrom app.modules.external_document_sources.live_sftp_adapters import live_sftp_registration_ready\n\nrouter = APIRouter(tags=["health"])\n_SERVICE = "maritime-claims-api"\n\n\ndef _timestamp() -> str:\n    return datetime.now(UTC).isoformat()\n\n\ndef database_ready() -> bool:\n    """Return database connectivity only; never expose connection/error details."""\n    try:\n        with create_session() as db:\n            db.execute(text("SELECT 1"))\n        return True\n    except Exception:\n        return False\n\n\ndef _sftp_runtime_state() -> str:\n    settings = get_settings()\n    if not settings.external_evidence_live_sftp_adapters_enabled:\n        return "disabled"\n    return "registered" if live_sftp_registration_ready() else "unavailable"\n\n\n@router.get("/health/live")\ndef liveness() -> dict[str, str]:\n    return {\n        "status": "ok",\n        "service": _SERVICE,\n        "check": "liveness",\n        "timestamp": _timestamp(),\n    }\n\n\n@router.get("/health/ready")\ndef readiness(response: Response) -> dict[str, str | dict[str, str]]:\n    db_ready = database_ready()\n    sftp_state = _sftp_runtime_state()\n    dependencies = {\n        "database": "ok" if db_ready else "unavailable",\n        "sftp_runtime": sftp_state,\n    }\n    if not db_ready or sftp_state == "unavailable":\n        response.status_code = status.HTTP_503_SERVICE_UNAVAILABLE\n        return {\n            "status": "not_ready",\n            "service": _SERVICE,\n            "check": "readiness",\n            "timestamp": _timestamp(),\n            "dependencies": dependencies,\n        }\n\n    return {\n        "status": "ready",\n        "service": _SERVICE,\n        "check": "readiness",\n        "timestamp": _timestamp(),\n        "dependencies": dependencies,\n    }\n\n\n@router.get("/health")\ndef health() -> dict[str, str]:\n    """Backward-compatible process health endpoint.\n\n    Runtime/orchestrator readiness must use `/health/ready`; this endpoint remains\n    a cheap liveness-compatible check for existing callers.\n    """\n    return {\n        "status": "ok",\n        "service": _SERVICE,\n        "timestamp": _timestamp(),\n    }\n''')

          Path('apps/api/tests/test_health.py').write_text('''from types import SimpleNamespace\n\nfrom fastapi.testclient import TestClient\n\nimport app.modules.external_document_sources.live_sftp_adapters as live_sftp\nimport app.modules.health.router as health_router\nfrom app.main import app\n\nclient = TestClient(app)\n\n\ndef test_health_endpoint() -> None:\n    response = client.get("/api/v1/health")\n    assert response.status_code == 200\n    assert response.json()["status"] == "ok"\n\n\ndef test_readiness_reports_sftp_disabled_without_registration_probe(monkeypatch) -> None:\n    monkeypatch.setattr(health_router, "database_ready", lambda: True)\n    monkeypatch.setattr(\n        health_router,\n        "get_settings",\n        lambda: SimpleNamespace(external_evidence_live_sftp_adapters_enabled=False),\n    )\n    monkeypatch.setattr(\n        health_router,\n        "live_sftp_registration_ready",\n        lambda: (_ for _ in ()).throw(AssertionError("registration probe must not run when disabled")),\n    )\n\n    response = client.get("/api/v1/health/ready")\n\n    assert response.status_code == 200\n    assert response.json()["dependencies"] == {\n        "database": "ok",\n        "sftp_runtime": "disabled",\n    }\n\n\ndef test_readiness_reports_registered_without_customer_or_provider_io(monkeypatch) -> None:\n    monkeypatch.setattr(health_router, "database_ready", lambda: True)\n    monkeypatch.setattr(\n        health_router,\n        "get_settings",\n        lambda: SimpleNamespace(external_evidence_live_sftp_adapters_enabled=True),\n    )\n    monkeypatch.setattr(live_sftp, "_LIVE_SFTP_ADAPTERS_REGISTERED", True)\n    monkeypatch.setattr(\n        live_sftp,\n        "_resolved_public_addresses",\n        lambda *_args, **_kwargs: (_ for _ in ()).throw(AssertionError("network I/O forbidden in readiness")),\n    )\n    monkeypatch.setattr(\n        live_sftp.LiveSftpRuntime,\n        "_load_credential",\n        lambda *_args, **_kwargs: (_ for _ in ()).throw(AssertionError("secret I/O forbidden in readiness")),\n    )\n\n    response = client.get("/api/v1/health/ready")\n\n    assert response.status_code == 200\n    assert response.json()["dependencies"] == {\n        "database": "ok",\n        "sftp_runtime": "registered",\n    }\n\n\ndef test_readiness_fails_closed_when_sftp_enabled_but_not_registered(monkeypatch) -> None:\n    monkeypatch.setattr(health_router, "database_ready", lambda: True)\n    monkeypatch.setattr(\n        health_router,\n        "get_settings",\n        lambda: SimpleNamespace(external_evidence_live_sftp_adapters_enabled=True),\n    )\n    monkeypatch.setattr(live_sftp, "_LIVE_SFTP_ADAPTERS_REGISTERED", False)\n\n    response = client.get("/api/v1/health/ready")\n\n    assert response.status_code == 503\n    assert response.json()["status"] == "not_ready"\n    assert response.json()["dependencies"] == {\n        "database": "ok",\n        "sftp_runtime": "unavailable",\n    }\n''')

          runbook = Path('docs/operations/SFTP_PRODUCTION_RUNTIME.md')
          note = '''\n\n## Open-handle identity consistency\n\nProduction exact-content reads perform `lstat` before open and then `stat()` on the already-open SFTP file handle before accepting the first content byte. Mode and size must be present and identical; mtime, uid and gid are compared whenever both snapshots provide them. Missing minimum attributes fail closed as `opened_file_identity_unverifiable`; drift fails closed as `opened_file_identity_changed`. This mitigates ordinary concurrent path replacement but is not a cryptographic identity guarantee against a compromised SFTP server that controls both handles and metadata responses.\n'''
          text = runbook.read_text()
          if '## Open-handle identity consistency' not in text:
              runbook.write_text(text.rstrip() + note + '\n')

          lock = Path('apps/api/requirements.lock')
          lock_text = lock.read_text()
          lock.write_text(lock_text.replace(\n              '#    pip-compile --generate-hashes --no-index --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt',\n              '#    pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt',\n              1,\n          ))
          PY
      - name: Install locked API dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r apps/api/requirements.lock
      - name: Run AE-A targeted tests
        env:
          PYTHONPATH: apps/api
        run: pytest -q apps/api/tests/test_external_document_source_live_sftp_adapters.py apps/api/tests/test_health.py
      - name: Commit hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/app/modules/external_document_sources/live_sftp_adapters.py apps/api/app/modules/health/router.py apps/api/tests/test_external_document_source_live_sftp_adapters.py apps/api/tests/test_health.py docs/operations/SFTP_PRODUCTION_RUNTIME.md apps/api/requirements.lock
          git commit -m 'fix: harden AE-A SFTP runtime boundaries'
          git push origin HEAD:feature/sftp-production-integration-closure
