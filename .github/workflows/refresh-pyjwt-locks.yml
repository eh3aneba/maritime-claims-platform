name: Refresh PyJWT Locks

on:
  push:
    branches:
      - feature/sftp-nplus1-release-baseline-transition
    paths:
      - ".github/workflows/refresh-pyjwt-locks.yml"

permissions:
  contents: write

jobs:
  refresh-locks:
    name: Refresh PyJWT lock files
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'Cleanup temporary lock refresh workflow') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: feature/sftp-nplus1-release-baseline-transition
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-tools
        run: python -m pip install --upgrade pip pip-tools

      - name: Refresh only PyJWT in production lock
        run: >-
          python -m piptools compile
          --generate-hashes
          --strip-extras
          --upgrade-package 'PyJWT==2.15.1'
          --output-file=apps/api/requirements.lock
          apps/api/requirements.txt

      - name: Refresh only PyJWT in development lock
        run: >-
          python -m piptools compile
          --generate-hashes
          --strip-extras
          --upgrade-package 'PyJWT==2.15.1'
          --output-file=apps/api/requirements-dev.lock
          apps/api/requirements-dev.in

      - name: Validate lock delta
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^pyjwt==2\.15\.1 ' apps/api/requirements.lock
          grep -q '^pyjwt==2\.15\.1 ' apps/api/requirements-dev.lock
          mapfile -t changed < <(git diff --name-only | sort)
          printf 'Changed files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "apps/api/requirements-dev.lock"
          test "${changed[1]}" = "apps/api/requirements.lock"

      - name: Commit refreshed locks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/requirements.lock apps/api/requirements-dev.lock
          git commit -m 'Security: bump PyJWT locks to 2.15.1'
          git push origin HEAD:feature/sftp-nplus1-release-baseline-transition
