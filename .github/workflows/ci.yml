name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify general CI changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      dependency_required: ${{ steps.scope.outputs.dependency_required }}
      e2e_required: ${{ steps.scope.outputs.e2e_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head general CI scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "dependency_required=true" >> "$GITHUB_OUTPUT"
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "dependency_required=true" >> "$GITHUB_OUTPUT"
            echo "e2e_required=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to full general CI."
            exit 0
          fi

          dependency_required=false
          e2e_required=false

          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/api/requirements.txt|apps/api/requirements.lock|apps/api/requirements-dev.in|apps/api/requirements-dev.lock|apps/web/package.json|apps/web/package-lock.json|tests/browser/requirements.txt|tests/browser/requirements.lock|.github/workflows/ci.yml)
                dependency_required=true
                ;;
            esac

            case "$changed_path" in
              apps/api/*|apps/web/*|tests/browser/*|docker-compose*.yml|scripts/design_partner_preflight.sh|.github/workflows/ci.yml)
                e2e_required=true
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "dependency_required=$dependency_required" >> "$GITHUB_OUTPUT"
          echo "e2e_required=$e2e_required" >> "$GITHUB_OUTPUT"
          echo "Dependency lock job required: $dependency_required"
          echo "Design partner E2E required: $e2e_required"

  migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_ci
      SECRET_KEY: ci-only-not-a-deployment-secret-change-on-every-run-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-ci-migration-documents
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify database revision matches Alembic heads
        run: |
          python - <<'PY'
          import os

          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          expected_heads = set(ScriptDirectory.from_config(config).get_heads())
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              current_heads = set(MigrationContext.configure(connection).get_current_heads())
          engine.dispose()

          if current_heads != expected_heads:
              raise SystemExit(
                  f"Database revisions {sorted(current_heads)} do not match "
                  f"Alembic heads {sorted(expected_heads)}"
              )
          print(f"Database is at Alembic head: {', '.join(sorted(current_heads))}")
          PY

      - name: Run application preflight against PostgreSQL
        run: python -m app.core.preflight

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  dependency-locks:
    name: Dependency lock consistency
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.dependency_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
            tests/browser/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate dependency locks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools==7.6.1"
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements.lock --strip-extras apps/api/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements.lock apps/api/requirements.txt
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=apps/api/requirements-dev.lock --strip-extras apps/api/requirements-dev.in" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=apps/api/requirements-dev.lock apps/api/requirements-dev.in
          CUSTOM_COMPILE_COMMAND="pip-compile --generate-hashes --output-file=tests/browser/requirements.lock --strip-extras tests/browser/requirements.txt" \
            pip-compile --generate-hashes --strip-extras --resolver=backtracking \
              --output-file=tests/browser/requirements.lock tests/browser/requirements.txt
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
            --prefix apps/web

      - name: Verify committed locks are current
        run: |
          git diff --check
          git diff --exit-code -- \
            apps/api/requirements.lock \
            apps/api/requirements-dev.lock \
            apps/web/package-lock.json \
            tests/browser/requirements.lock

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

  design-partner-e2e:
    name: Design partner browser E2E
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/browser/requirements.lock

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r tests/browser/requirements.lock
          python -m pip check
          python -m playwright install --with-deps chromium

      - name: Prepare isolated CI environment
        run: |
          umask 077
          cat > .env.ci <<'EOF'
          APP_ENV=test
          APP_NAME="Maritime Claims & Risk Intelligence Platform"
          API_V1_PREFIX=/api/v1
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:3000
          POSTGRES_DB=mcri_ci
          POSTGRES_USER=mcri_ci
          POSTGRES_PASSWORD=mcri_ci_password
          DATABASE_URL=postgresql+psycopg://mcri_ci:mcri_ci_password@db:5432/mcri_ci
          SECRET_KEY=ci-only-not-a-deployment-secret-change-on-every-run-2026
          STORAGE_BACKEND=local
          LOCAL_STORAGE_PATH=/data/documents
          PROCESSING_MAX_ATTEMPTS=1
          AI_PROVIDER=disabled
          AI_MODEL=
          OPENAI_API_KEY=
          ALLOW_EXTERNAL_AI_RESTRICTED=false
          MCRI_DEMO_ORG_NAME="CI Pilot Marine Insurer"
          MCRI_DEMO_ORG_SLUG=pilot
          MCRI_DEMO_EMAIL=manager@demo.mcri.app
          MCRI_DEMO_PASSWORD=ci-demo-password-2026
          EOF

      - name: Start and validate design-partner stack
        run: bash scripts/design_partner_preflight.sh .env.ci

      - name: Run MT ORION browser journey
        run: |
          set -a
          source .env.ci
          set +a
          export MCRI_WEB_URL=http://127.0.0.1:3000
          export MCRI_E2E_SCREENSHOT=artifacts/design-partner-e2e.png
          export MCRI_E2E_RETRY_INFRA=true
          export MCRI_COMPOSE_ENV_FILE=.env.ci
          python tests/browser/design_partner_e2e.py
          python tests/browser/claim_qa_synthesis_e2e.py
          python tests/browser/ai_operations_e2e.py
          python tests/browser/governance_webhooks_e2e.py
          python tests/browser/claim_workbench_e2e.py
          python tests/browser/processing_actionability_e2e.py
          python tests/browser/domain_classification_ui_e2e.py
          python tests/browser/localization_e2e.py
          python tests/browser/chronology_localization_e2e.py
          python tests/browser/chronology_conflict_maturity_e2e.py
          python tests/browser/review_surfaces_localization_e2e.py
          python tests/browser/technical_operator_maturity_e2e.py
          python tests/browser/evidence_matrix_maturity_e2e.py
          python tests/browser/correspondence_claim_pack_localization_e2e.py
          python tests/browser/ai_governance_localization_e2e.py
          python tests/browser/final_localization_accessibility_e2e.py
          python tests/browser/ai_surface_consolidation_e2e.py
          python tests/browser/intake_maturity_e2e.py
          python tests/browser/technical_real_acceptance_e2e.py
          python tests/browser/recovery_decision_lineage_e2e.py
          python tests/browser/recovery_claim_pack_reporting_e2e.py
          python tests/browser/external_evidence_operator_e2e.py
          python tests/browser/assessment_real_acceptance_e2e.py
          python tests/browser/correspondence_integrity_e2e.py
          python tests/browser/correspondence_claim_pack_final_acceptance_e2e.py

      - name: Capture container diagnostics
        if: failure()
        run: |
          mkdir -p artifacts
          docker compose --env-file .env.ci ps -a > artifacts/docker-compose-ps.txt || true
          docker compose --env-file .env.ci logs --no-color > artifacts/docker-compose.log || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: design-partner-e2e
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove CI containers and volumes
        if: always()
        run: docker compose --env-file .env.ci down -v --remove-orphans || true

  scoped-ci-gate:
    name: Scoped CI gate
    needs:
      - changes
      - dependency-locks
      - design-partner-e2e
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce classified CI scope
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.changes.result }}
          DEPENDENCY_REQUIRED: ${{ needs.changes.outputs.dependency_required }}
          DEPENDENCY_RESULT: ${{ needs.dependency-locks.result }}
          E2E_REQUIRED: ${{ needs.changes.outputs.e2e_required }}
          E2E_RESULT: ${{ needs.design-partner-e2e.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::General CI scope classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          require_selected_job() {
            local required="$1"
            local result="$2"
            local label="$3"

            if [ "$required" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "::error::$label was required but finished with result: $result"
                exit 1
              fi
              return
            fi

            case "$result" in
              skipped|success)
                ;;
              *)
                echo "::error::$label was not required but finished unexpectedly with result: $result"
                exit 1
                ;;
            esac
          }

          require_selected_job "$DEPENDENCY_REQUIRED" "$DEPENDENCY_RESULT" "Dependency lock consistency"
          require_selected_job "$E2E_REQUIRED" "$E2E_RESULT" "Design partner browser E2E"

          echo "Scoped CI gate passed."

