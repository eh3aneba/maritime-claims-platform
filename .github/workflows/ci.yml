name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:5432/mcri_ci
      SECRET_KEY: ci-only-not-a-deployment-secret-change-on-every-run-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-ci-documents
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx
          python -m pip check

      - name: Compile backend
        run: python -m compileall app alembic

      - name: Run backend test suite
        run: pytest -q

  migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_ci
      SECRET_KEY: ci-only-not-a-deployment-secret-change-on-every-run-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-ci-migration-documents
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Verify database revision matches Alembic heads
        run: |
          python - <<'PY'
          import os

          from alembic.config import Config
          from alembic.runtime.migration import MigrationContext
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine

          config = Config("alembic.ini")
          expected_heads = set(ScriptDirectory.from_config(config).get_heads())
          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.connect() as connection:
              current_heads = set(MigrationContext.configure(connection).get_current_heads())
          engine.dispose()

          if current_heads != expected_heads:
              raise SystemExit(
                  f"Database revisions {sorted(current_heads)} do not match "
                  f"Alembic heads {sorted(expected_heads)}"
              )
          print(f"Database is at Alembic head: {', '.join(sorted(current_heads))}")
          PY

      - name: Run application preflight against PostgreSQL
        run: python -m app.core.preflight

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api/v1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet
