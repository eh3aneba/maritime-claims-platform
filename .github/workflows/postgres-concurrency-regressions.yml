name: PostgreSQL Concurrency Regression Suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PostgreSQL concurrency scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
      postgres_required: ${{ steps.scope.outputs.postgres_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head PostgreSQL concurrency scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          all_groups='["scheduling","observation","review","service-executor","authorization-foundation","admission-execution"]'
          placeholder_groups='["scheduling"]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "postgres_required=true" >> "$GITHUB_OUTPUT"
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: all PostgreSQL concurrency groups required."
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "postgres_required=true" >> "$GITHUB_OUTPUT"
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to all PostgreSQL concurrency groups."
            exit 0
          fi

          groups=""
          postgres_required=false
          fail_closed=false

          add_group() {
            local group="$1"
            case ",$groups," in
              *",$group,"*) ;;
              *) groups="${groups:+$groups,}$group" ;;
            esac
          }

          while IFS= read -r path; do
            case "$path" in
              apps/api/tests/test_external_document_source_recurring_observation_schedule_concurrency_postgres.py|apps/api/tests/test_external_document_source_due_tick_dispatch_concurrency_postgres.py)
                postgres_required=true
                add_group scheduling
                ;;
              apps/api/tests/test_external_document_source_due_tick_observation_concurrency_postgres.py|apps/api/tests/test_external_document_source_observation_refresh_execution_concurrency_postgres.py)
                postgres_required=true
                add_group observation
                ;;
              apps/api/tests/test_external_document_source_observation_review_handoff_concurrency_postgres.py|apps/api/tests/test_external_document_source_observation_review_decision_concurrency_postgres.py)
                postgres_required=true
                add_group review
                ;;
              apps/api/tests/test_external_document_source_due_tick_service_executor_concurrency_postgres.py)
                postgres_required=true
                add_group service-executor
                ;;
              apps/api/tests/test_external_document_source_observation_refresh_admission_authorization_concurrency_postgres.py|apps/api/tests/test_external_document_source_family_version_concurrency_postgres.py|apps/api/tests/test_processing_lease_postgres.py|apps/api/tests/test_payment_settlement_concurrency_postgres.py)
                postgres_required=true
                add_group authorization-foundation
                ;;
              apps/api/tests/test_external_document_source_observation_refresh_admission_execution_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_handshake_execution_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_transport_verification_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_session_activation_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_directory_listing_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_file_content_proof_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_quarantine_staging_concurrency_postgres.py)
                postgres_required=true
                add_group admission-execution
                ;;
              .github/workflows/postgres-*.yml|apps/api/*)
                postgres_required=true
                fail_closed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ "$postgres_required" != "true" ]; then
            echo "postgres_required=false" >> "$GITHUB_OUTPUT"
            echo "groups=$placeholder_groups" >> "$GITHUB_OUTPUT"
            echo "No PostgreSQL concurrency validation required for this exact-head diff."
            exit 0
          fi

          echo "postgres_required=true" >> "$GITHUB_OUTPUT"

          if [ "$fail_closed" = true ] || [ -z "$groups" ]; then
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "Shared, runtime, workflow, or ambiguous backend change: all PostgreSQL concurrency groups required."
            exit 0
          fi

          groups_json="[\"${groups//,/\",\"}\"]"
          echo "groups=$groups_json" >> "$GITHUB_OUTPUT"
          echo "Selected PostgreSQL concurrency groups: $groups"

  postgres-concurrency:
    name: PostgreSQL concurrency (${{ matrix.group }})
    needs: classify
    if: ${{ needs.classify.outputs.postgres_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.classify.outputs.groups) }}
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_concurrency_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_concurrency_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_concurrency_ci
      MCRI_TEST_DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_concurrency_ci
      SECRET_KEY: ci-only-consolidated-postgres-concurrency-not-a-deployment-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-consolidated-postgres-concurrency-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Scheduling — recurring observation schedule
        if: ${{ matrix.group == 'scheduling' }}
        env:
          EXTERNAL_EVIDENCE_OBSERVATION_SCHEDULE_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_recurring_observation_schedule_concurrency_postgres.py

      - name: Scheduling — due-tick dispatch
        if: ${{ matrix.group == 'scheduling' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_DISPATCH_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_due_tick_dispatch_concurrency_postgres.py

      - name: Observation — due-tick observation
        if: ${{ matrix.group == 'observation' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_due_tick_observation_concurrency_postgres.py

      - name: Observation — refresh execution
        if: ${{ matrix.group == 'observation' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_observation_refresh_execution_concurrency_postgres.py

      - name: Review — handoff and decision concurrency
        if: ${{ matrix.group == 'review' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_review_handoff_concurrency_postgres.py

      - name: Service executor — full concurrency suite
        if: ${{ matrix.group == 'service-executor' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_SERVICE_EXECUTOR_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_due_tick_service_executor_concurrency_postgres.py

      - name: Authorization/foundation — refresh admission authorization
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_ADMISSION_AUTH_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_refresh_admission_authorization_concurrency_postgres.py

      - name: Authorization/foundation — Evidence version concurrency
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          EXTERNAL_EVIDENCE_VERSION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_family_version_concurrency_postgres.py

      - name: Authorization/foundation — processing lease fencing
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          PROCESSING_LEASE_POSTGRES_TEST: "1"
        run: pytest -q tests/test_processing_lease_postgres.py

      - name: Authorization/foundation — payment settlement concurrency
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          PAYMENT_SETTLEMENT_POSTGRES_TEST: "1"
        run: pytest -q tests/test_payment_settlement_concurrency_postgres.py

      - name: Admission execution — refresh admission execution
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_ADMISSION_EXEC_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_refresh_admission_execution_concurrency_postgres.py

      - name: Admission execution — SFTP handshake authorization consumption
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_HANDSHAKE_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_sftp_handshake_execution_concurrency_postgres.py

      - name: Admission execution — SFTP transport verification
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_TRANSPORT_VERIFICATION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_transport_verification_concurrency_postgres.py

      - name: Admission execution — SFTP authentication/session activation
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_SESSION_ACTIVATION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_session_activation_concurrency_postgres.py

      - name: Admission execution — SFTP directory metadata listing
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_DIRECTORY_LISTING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_directory_listing_concurrency_postgres.py

      - name: Admission execution — SFTP bounded file-content proof
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_FILE_CONTENT_PROOF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_file_content_proof_concurrency_postgres.py

      - name: Admission execution — SFTP digest-verified quarantine staging
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_QUARANTINE_STAGING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_quarantine_staging_concurrency_postgres.py

  postgres-concurrency-gate:
    name: PostgreSQL concurrency gate
    needs:
      - classify
      - postgres-concurrency
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce classified PostgreSQL concurrency scope
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          POSTGRES_REQUIRED: ${{ needs.classify.outputs.postgres_required }}
          POSTGRES_RESULT: ${{ needs.postgres-concurrency.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::PostgreSQL concurrency scope classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          if [ "$POSTGRES_REQUIRED" = "true" ]; then
            if [ "$POSTGRES_RESULT" != "success" ]; then
              echo "::error::Selected PostgreSQL concurrency validation was required but finished with result: $POSTGRES_RESULT"
              exit 1
            fi
          else
            case "$POSTGRES_RESULT" in
              skipped|success)
                ;;
              *)
                echo "::error::PostgreSQL concurrency validation was not required but finished unexpectedly with result: $POSTGRES_RESULT"
                exit 1
                ;;
            esac
          fi

          echo "PostgreSQL concurrency gate passed."

