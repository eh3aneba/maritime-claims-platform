name: PostgreSQL Concurrency Regression Suite

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-concurrency-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PostgreSQL concurrency scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      groups: ${{ steps.scope.outputs.groups }}
      postgres_required: ${{ steps.scope.outputs.postgres_required }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Classify exact-head PostgreSQL concurrency scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          all_groups='["scheduling","observation-due-tick","observation-refresh","observation-refresh-sftp-read-replay","observation-refresh-sftp-size-mismatch","review-core","review-sftp-changed","review-sftp-missing","review-sftp-unchanged","review-decision-sftp-changed-dismiss","review-decision-sftp-missing-ack","review-decision-sftp-missing-dismiss","review-decision-sftp-refresh-blocked","service-executor-core","service-executor-sftp","authorization-foundation","admission-execution"]'
          placeholder_groups='["scheduling"]'

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "postgres_required=true" >> "$GITHUB_OUTPUT"
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: all PostgreSQL concurrency groups required."
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "postgres_required=true" >> "$GITHUB_OUTPUT"
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing PR SHA metadata; failing closed to all PostgreSQL concurrency groups."
            exit 0
          fi

          groups=""
          postgres_required=false
          fail_closed=false

          add_group() {
            local group="$1"
            case ",$groups," in
              *",$group,"*) ;;
              *) groups="${groups:+$groups,}$group" ;;
            esac
          }

          while IFS= read -r path; do
            case "$path" in
              apps/api/tests/test_external_document_source_recurring_observation_schedule_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_recurring_observation_schedule.py|apps/api/tests/test_external_document_source_due_tick_dispatch_concurrency_postgres.py)
                postgres_required=true
                add_group scheduling
                ;;
              apps/api/tests/test_external_document_source_due_tick_observation_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_recurring_provider_lineage.py)
                postgres_required=true
                add_group observation-due-tick
                ;;
              apps/api/tests/test_external_document_source_observation_refresh_execution_concurrency_postgres.py)
                postgres_required=true
                add_group observation-refresh
                ;;
              apps/api/tests/test_external_document_source_sftp_observation_refresh_execution.py)
                postgres_required=true
                add_group observation-refresh-sftp-read-replay
                add_group observation-refresh-sftp-size-mismatch
                ;;
              apps/api/tests/test_external_document_source_observation_review_handoff_concurrency_postgres.py|apps/api/tests/test_external_document_source_observation_review_decision_concurrency_postgres.py)
                postgres_required=true
                add_group review-core
                ;;
              apps/api/tests/test_external_document_source_sftp_observation_review_handoff.py)
                postgres_required=true
                add_group review-sftp-changed
                add_group review-sftp-missing
                add_group review-sftp-unchanged
                ;;
              apps/api/tests/test_external_document_source_sftp_observation_review_decision.py)
                postgres_required=true
                add_group review-decision-sftp-changed-dismiss
                add_group review-decision-sftp-missing-ack
                add_group review-decision-sftp-missing-dismiss
                add_group review-decision-sftp-refresh-blocked
                ;;
              apps/api/tests/test_external_document_source_due_tick_service_executor_concurrency_postgres.py)
                postgres_required=true
                add_group service-executor-core
                ;;
              apps/api/tests/test_external_document_source_sftp_due_tick_service_executor.py)
                postgres_required=true
                add_group service-executor-sftp
                ;;
              apps/api/tests/test_external_document_source_observation_refresh_admission_authorization_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_evidence_admission_authorization_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_evidence_family_binding_concurrency_postgres.py|apps/api/tests/test_external_document_source_family_version_concurrency_postgres.py|apps/api/tests/test_processing_lease_postgres.py|apps/api/tests/test_payment_settlement_concurrency_postgres.py)
                postgres_required=true
                add_group authorization-foundation
                ;;
              apps/api/tests/test_external_document_source_observation_refresh_admission_execution_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_evidence_admission_execution_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_handshake_execution_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_transport_verification_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_session_activation_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_directory_listing_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_file_content_proof_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_quarantine_staging_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_checkpoint_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_change_detection_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_successor_restaging_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_checkpoint_advancement_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_successor_change_detection_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_generation3_restaging_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_generation3_checkpoint_advancement_concurrency_postgres.py|apps/api/tests/test_external_document_source_sftp_generation3_change_detection_concurrency_postgres.py)
                postgres_required=true
                add_group admission-execution
                ;;
              .github/workflows/postgres-*.yml|apps/api/*)
                postgres_required=true
                fail_closed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if [ "$postgres_required" != "true" ]; then
            echo "postgres_required=false" >> "$GITHUB_OUTPUT"
            echo "groups=$placeholder_groups" >> "$GITHUB_OUTPUT"
            echo "No PostgreSQL concurrency validation required for this exact-head diff."
            exit 0
          fi

          echo "postgres_required=true" >> "$GITHUB_OUTPUT"

          if [ "$fail_closed" = true ] || [ -z "$groups" ]; then
            echo "groups=$all_groups" >> "$GITHUB_OUTPUT"
            echo "Shared, runtime, workflow, or ambiguous backend change: all PostgreSQL concurrency groups required."
            exit 0
          fi

          groups_json="[\"${groups//,/\",\"}\"]"
          echo "groups=$groups_json" >> "$GITHUB_OUTPUT"
          echo "Selected PostgreSQL concurrency groups: $groups"

  postgres-concurrency:
    name: PostgreSQL concurrency (${{ matrix.group }})
    needs: classify
    if: ${{ needs.classify.outputs.postgres_required == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.classify.outputs.groups) }}
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_concurrency_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_concurrency_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_concurrency_ci
      MCRI_TEST_DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_concurrency_ci
      SECRET_KEY: ci-only-consolidated-postgres-concurrency-not-a-deployment-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-consolidated-postgres-concurrency-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Scheduling — recurring observation schedule
        if: ${{ matrix.group == 'scheduling' }}
        env:
          EXTERNAL_EVIDENCE_OBSERVATION_SCHEDULE_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_recurring_observation_schedule_concurrency_postgres.py tests/test_external_document_source_sftp_recurring_observation_schedule.py

      - name: Scheduling — due-tick dispatch
        if: ${{ matrix.group == 'scheduling' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_DISPATCH_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_due_tick_dispatch_concurrency_postgres.py

      - name: Observation — due-tick observation
        if: ${{ matrix.group == 'observation-due-tick' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_due_tick_observation_concurrency_postgres.py tests/test_external_document_source_sftp_recurring_provider_lineage.py

      - name: Observation — refresh execution
        if: ${{ matrix.group == 'observation-refresh' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_observation_refresh_execution_concurrency_postgres.py

      - name: Observation — SFTP refresh read and replay
        if: ${{ matrix.group == 'observation-refresh-sftp-read-replay' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_observation_refresh_execution.py::test_phase_ab_sftp_approve_refresh_executes_one_exact_read_and_replays

      - name: Observation — SFTP refresh size mismatch
        if: ${{ matrix.group == 'observation-refresh-sftp-size-mismatch' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_observation_refresh_execution.py::test_phase_ab_sftp_refresh_size_mismatch_fails_before_quarantine_write

      - name: Review — core handoff and decision concurrency
        if: ${{ matrix.group == 'review-core' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_review_handoff_concurrency_postgres.py

      - name: Review — SFTP changed handoff
        if: ${{ matrix.group == 'review-sftp-changed' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 'tests/test_external_document_source_sftp_observation_review_handoff.py::test_phase_z_projects_sftp_changed_or_missing_to_pending_review_without_io[changed]'

      - name: Review — SFTP missing handoff
        if: ${{ matrix.group == 'review-sftp-missing' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 'tests/test_external_document_source_sftp_observation_review_handoff.py::test_phase_z_projects_sftp_changed_or_missing_to_pending_review_without_io[missing]'

      - name: Review — SFTP unchanged ineligible
        if: ${{ matrix.group == 'review-sftp-unchanged' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_observation_review_handoff.py::test_phase_z_sftp_unchanged_observation_is_not_review_eligible

      - name: Review decision — SFTP changed dismiss
        if: ${{ matrix.group == 'review-decision-sftp-changed-dismiss' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_observation_review_decision.py::test_phase_aa_changed_sftp_handoff_can_be_dismissed_and_replayed_without_io

      - name: Review decision — SFTP missing acknowledge
        if: ${{ matrix.group == 'review-decision-sftp-missing-ack' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 'tests/test_external_document_source_sftp_observation_review_decision.py::test_phase_aa_missing_sftp_handoff_supports_human_terminal_decisions[acknowledge_missing-missing_acknowledged]'

      - name: Review decision — SFTP missing dismiss
        if: ${{ matrix.group == 'review-decision-sftp-missing-dismiss' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 'tests/test_external_document_source_sftp_observation_review_decision.py::test_phase_aa_missing_sftp_handoff_supports_human_terminal_decisions[dismiss-dismissed]'

      - name: Review decision — SFTP approve-refresh blocked
        if: ${{ matrix.group == 'review-decision-sftp-refresh-blocked' }}
        env:
          EXTERNAL_EVIDENCE_REVIEW_HANDOFF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_observation_review_decision.py::test_phase_aa_sftp_approve_refresh_remains_closed_before_decision_persistence

      - name: Service executor — core concurrency
        if: ${{ matrix.group == 'service-executor-core' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_SERVICE_EXECUTOR_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_due_tick_service_executor_concurrency_postgres.py

      - name: Service executor — SFTP compatibility smoke
        if: ${{ matrix.group == 'service-executor-sftp' }}
        env:
          EXTERNAL_EVIDENCE_DUE_TICK_SERVICE_EXECUTOR_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_due_tick_service_executor.py::test_phase_y_generic_dispatch_and_service_consume_sftp_once_with_replay

      - name: Authorization/foundation — refresh admission authorization
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_ADMISSION_AUTH_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_refresh_admission_authorization_concurrency_postgres.py


      - name: Authorization/foundation — SFTP Evidence admission authorization currentness
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          SFTP_EVIDENCE_ADMISSION_AUTHORIZATION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_evidence_admission_authorization_concurrency_postgres.py
      - name: Authorization/foundation — SFTP Evidence-family binding
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          SFTP_EVIDENCE_FAMILY_BINDING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_evidence_family_binding_concurrency_postgres.py

      - name: Authorization/foundation — Evidence version concurrency
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          EXTERNAL_EVIDENCE_VERSION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_family_version_concurrency_postgres.py

      - name: Authorization/foundation — processing lease fencing
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          PROCESSING_LEASE_POSTGRES_TEST: "1"
        run: pytest -q tests/test_processing_lease_postgres.py

      - name: Authorization/foundation — payment settlement concurrency
        if: ${{ matrix.group == 'authorization-foundation' }}
        env:
          PAYMENT_SETTLEMENT_POSTGRES_TEST: "1"
        run: pytest -q tests/test_payment_settlement_concurrency_postgres.py

      - name: Admission execution — refresh admission execution
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          EXTERNAL_EVIDENCE_REFRESH_ADMISSION_EXEC_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_observation_refresh_admission_execution_concurrency_postgres.py

      - name: Admission execution — SFTP initial Evidence admission execution
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_EVIDENCE_ADMISSION_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_evidence_admission_execution_concurrency_postgres.py

      - name: Admission execution — SFTP handshake authorization consumption
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_HANDSHAKE_EXECUTION_POSTGRES_TEST: "1"
        run: pytest -q tests/test_external_document_source_sftp_handshake_execution_concurrency_postgres.py

      - name: Admission execution — SFTP transport verification
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_TRANSPORT_VERIFICATION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_transport_verification_concurrency_postgres.py

      - name: Admission execution — SFTP authentication/session activation
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_SESSION_ACTIVATION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_session_activation_concurrency_postgres.py

      - name: Admission execution — SFTP directory metadata listing
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_DIRECTORY_LISTING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_directory_listing_concurrency_postgres.py

      - name: Admission execution — SFTP bounded file-content proof
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_FILE_CONTENT_PROOF_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_file_content_proof_concurrency_postgres.py

      - name: Admission execution — SFTP digest-verified quarantine staging
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_QUARANTINE_STAGING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_quarantine_staging_concurrency_postgres.py

      - name: Admission execution — SFTP initial quarantine checkpoint
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_CHECKPOINT_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_checkpoint_concurrency_postgres.py

      - name: Admission execution — SFTP exact-file metadata change detection
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_CHANGE_DETECTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_change_detection_concurrency_postgres.py

      - name: Admission execution — SFTP changed-file successor restaging
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_SUCCESSOR_RESTAGING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_successor_restaging_concurrency_postgres.py

      - name: Admission execution — SFTP successor checkpoint advancement
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_CHECKPOINT_ADVANCEMENT_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_checkpoint_advancement_concurrency_postgres.py

      - name: Admission execution — SFTP successor-aware exact-file observation
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_SUCCESSOR_CHANGE_DETECTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_successor_change_detection_concurrency_postgres.py

      - name: Admission execution — SFTP generation-3 successor restaging
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_GENERATION3_RESTAGING_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_generation3_restaging_concurrency_postgres.py

      - name: Admission execution — SFTP generation-3 checkpoint advancement
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_GENERATION3_CHECKPOINT_ADVANCEMENT_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_generation3_checkpoint_advancement_concurrency_postgres.py

      - name: Admission execution — SFTP generation-3 exact-file observation
        if: ${{ matrix.group == 'admission-execution' }}
        env:
          SFTP_GENERATION3_CHANGE_DETECTION_POSTGRES_TEST: "1"
        run: pytest -q --durations=10 tests/test_external_document_source_sftp_generation3_change_detection_concurrency_postgres.py

  postgres-concurrency-gate:
    name: PostgreSQL concurrency gate
    needs:
      - classify
      - postgres-concurrency
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce classified PostgreSQL concurrency scope
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          POSTGRES_REQUIRED: ${{ needs.classify.outputs.postgres_required }}
          POSTGRES_RESULT: ${{ needs.postgres-concurrency.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "::error::PostgreSQL concurrency scope classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          if [ "$POSTGRES_REQUIRED" = "true" ]; then
            if [ "$POSTGRES_RESULT" != "success" ]; then
              echo "::error::Selected PostgreSQL concurrency validation was required but finished with result: $POSTGRES_RESULT"
              exit 1
            fi
          else
            case "$POSTGRES_RESULT" in
              skipped|success)
                ;;
              *)
                echo "::error::PostgreSQL concurrency validation was not required but finished unexpectedly with result: $POSTGRES_RESULT"
                exit 1
                ;;
            esac
          fi

          echo "PostgreSQL concurrency gate passed."

