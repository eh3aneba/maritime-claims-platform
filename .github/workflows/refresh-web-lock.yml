name: Temporary Web Lock Refresh

on:
  push:
    branches:
      - agent/supply-chain-security
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-web-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    name: Regenerate package lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Regenerate package lock
        run: >-
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          --prefix apps/web

      - name: Commit refreshed lock
        run: |
          git diff --check
          if git diff --quiet -- apps/web/package-lock.json; then
            echo "Package lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          git commit -m "chore(web): refresh package lock"
          git push
