name: Supply Chain Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Production dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Create SPDX dependency inventory
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: artifacts/maritime-claims-platform.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Validate SBOM
        run: >-
          jq -e
          '.spdxVersion and (.packages | type == "array") and (.packages | length > 0)'
          artifacts/maritime-claims-platform.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: maritime-claims-platform-sbom
          path: artifacts/maritime-claims-platform.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Audit Python production lock
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: apps/api/requirements.lock
          require-hashes: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

  secret-history:
    name: Secret history scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  container-images:
    name: Container image vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build production images
        run: |
          docker build --pull --tag maritime-claims-api:ci apps/api
          docker build --pull \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000/api/v1 \
            --tag maritime-claims-web:ci apps/web

      - name: Scan API image
        id: scan-api
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: maritime-claims-api:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
          cache-db: true

      - name: Scan web image
        id: scan-web
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: maritime-claims-web:ci
          fail-build: true
          severity-cutoff: high
          output-format: table
          cache-db: true

      - name: Enforce image scan results
        if: always()
        env:
          API_SCAN_OUTCOME: ${{ steps.scan-api.outcome }}
          WEB_SCAN_OUTCOME: ${{ steps.scan-web.outcome }}
        run: |
          echo "API image scan: ${API_SCAN_OUTCOME}"
          echo "Web image scan: ${WEB_SCAN_OUTCOME}"
          test "${API_SCAN_OUTCOME}" = "success"
          test "${WEB_SCAN_OUTCOME}" = "success"
