name: Supply Chain Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Production dependency audit and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare artifact directory
        run: mkdir -p artifacts

      - name: Create SPDX dependency inventory
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: artifacts/maritime-claims-platform.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.0

      - name: Validate SBOM
        run: >-
          jq -e
          '.spdxVersion and (.packages | type == "array") and (.packages | length > 0)'
          artifacts/maritime-claims-platform.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: maritime-claims-platform-sbom
          path: artifacts/maritime-claims-platform.spdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Audit Python production lock
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: apps/api/requirements.lock
          require-hashes: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Audit web production dependencies
        working-directory: apps/web
        shell: bash
        run: |
          set -uo pipefail
          attempts=3
          delay_seconds=10
          attempt_timeout_seconds=75
          export npm_config_fetch_timeout=60000
          export npm_config_fetch_retries=0

          for attempt in $(seq 1 "${attempts}"); do
            audit_log="$(mktemp)"
            set +e
            timeout --signal=TERM --kill-after=5s "${attempt_timeout_seconds}s" \
              npm audit --omit=dev --audit-level=high 2>&1 | tee "${audit_log}"
            audit_status=${PIPESTATUS[0]}
            set -e

            if [ "${audit_status}" -eq 0 ]; then
              rm -f "${audit_log}"
              exit 0
            fi

            transient_failure=false
            if [ "${audit_status}" -eq 124 ]; then
              transient_failure=true
              echo "::warning::npm audit timed out after ${attempt_timeout_seconds}s on attempt ${attempt}/${attempts}."
            elif grep -Eqi '(^|[^0-9])(429|502|503|504)([^0-9]|$)|Service Unavailable|Bad Gateway|Gateway Timeout|audit endpoint returned an error|network timeout|ECONNRESET|ETIMEDOUT|EAI_AGAIN|FETCH_ERROR' "${audit_log}"; then
              transient_failure=true
            fi

            if [ "${transient_failure}" = true ]; then
              if [ "${attempt}" -lt "${attempts}" ]; then
                echo "::warning::npm audit service/network failure on attempt ${attempt}/${attempts}; retrying in ${delay_seconds}s."
                rm -f "${audit_log}"
                sleep "${delay_seconds}"
                continue
              fi

              echo "::error::npm audit registry remained unavailable across ${attempts} bounded attempts; unable to verify production web dependencies."
              {
                echo "### npm audit unavailable — verification failed"
                echo
                echo "The npm audit registry was unavailable after ${attempts} bounded attempts."
                echo "The dependency audit fails closed because no container-image vulnerability scan is configured."
              } >> "${GITHUB_STEP_SUMMARY}"
              rm -f "${audit_log}"
              exit 1
            fi

            # A non-network npm audit failure (including an actual vulnerability
            # finding at the configured high threshold) remains a hard failure.
            rm -f "${audit_log}"
            exit "${audit_status}"
          done

  secret-history:
    name: Secret history scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
