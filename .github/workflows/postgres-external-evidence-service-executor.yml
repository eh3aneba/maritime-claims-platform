name: PostgreSQL External Evidence Service Executor Concurrency

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: external-evidence-service-executor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-executor-concurrency:
    name: External Evidence service-executor concurrency (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite:
          - two-service-workers
          - human-vs-service
          - disable-vs-service
          - canonical-version-transition
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: mcri_due_tick_service_executor_ci
          POSTGRES_USER: mcri_ci
          POSTGRES_PASSWORD: mcri_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcri_ci -d mcri_due_tick_service_executor_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_due_tick_service_executor_ci
      MCRI_TEST_DATABASE_URL: postgresql+psycopg://mcri_ci:mcri_ci_password@127.0.0.1:5432/mcri_due_tick_service_executor_ci
      EXTERNAL_EVIDENCE_DUE_TICK_SERVICE_EXECUTOR_POSTGRES_TEST: "1"
      SECRET_KEY: ci-only-due-tick-service-executor-not-a-deployment-secret-2026
      AI_PROVIDER: disabled
      OPENAI_API_KEY: ""
      LOCAL_STORAGE_PATH: /tmp/mcri-due-tick-service-executor-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run service-executor concurrency regression
        shell: bash
        run: |
          case "${{ matrix.suite }}" in
            two-service-workers)
              selector="two_service_workers"
              ;;
            human-vs-service)
              selector="human_ac_vs_service"
              ;;
            disable-vs-service)
              selector="disable_vs_service"
              ;;
            canonical-version-transition)
              selector="canonical_version_transition"
              ;;
            *)
              echo "Unknown concurrency suite: ${{ matrix.suite }}" >&2
              exit 1
              ;;
          esac
          pytest -q tests/test_external_document_source_due_tick_service_executor_concurrency_postgres.py -k "$selector"
