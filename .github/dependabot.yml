version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Baku
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /tests/browser
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Baku
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Baku
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Asia/Baku
    open-pull-requests-limit: 5
